<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Block Diagram - Smart Irrigation System</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background:#f7f9fc; padding:18px }
    .note { font-size:13px; color:#333; margin-top:10px }
    svg { max-width:100%; border:1px solid #e0e6ef; background:white; box-shadow:0 6px 18px rgba(20,30,60,0.06); }
    .block { fill:#ffffff; stroke:#2b6cb0; stroke-width:2; rx:8; }
    .title { font-weight:700; font-size:13px; fill:#0f1724 }
    .label { font-size:12px; fill:#0f1724 }
    .sub { font-size:11px; fill:#475569 }
    .arrow { stroke:#2b6cb0; stroke-width:2; marker-end:url(#arrowhead); }
  </style>
</head>
<body>

<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2b6cb0" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="30" y="36" class="title">Smart Irrigation System — Block Diagram</text>

  <!-- Farmer Mobile -->
  <rect class="block" x="30" y="70" width="220" height="90" rx="10"/>
  <text x="50" y="100" class="title">Farmer Mobile</text>
  <text x="50" y="122" class="sub">SMS / Mobile App (Internet)</text>

  <!-- GSM / Main ESP32 -->
  <rect class="block" x="300" y="40" width="260" height="140" rx="10"/>
  <text x="320" y="72" class="title">Master Unit (GateWay)</text>
  <text x="320" y="96" class="label">GSM Module (SIM800L / SIM900)</text>
  <text x="320" y="114" class="label">ESP32 (Main Controller)</text>
  <text x="320" y="132" class="sub">LoRa (RA-02) Transceiver</text>

  <!-- arrow farmer -> master -->
  <line x1="250" y1="115" x2="300" y2="115" class="arrow" />

  <!-- LoRa cloud / link -->
  <g>
    <rect class="block" x="620" y="40" width="520" height="140" rx="10"/>
    <text x="640" y="72" class="title">LoRa RF Link (RA-02)</text>
    <text x="640" y="98" class="sub">Long-range, low-power mesh/star</text>

    <!-- Field nodes area -->
    <rect x="660" y="120" width="420" height="210" rx="8" fill="#f1f5f9" stroke="#e2e8f0" />
    <text x="672" y="142" class="label">Field Nodes (Distributed)</text>

    <!-- Valve Node 1 -->
    <rect class="block" x="690" y="160" width="160" height="90" rx="8"/>
    <text x="702" y="184" class="title">Valve Node #6</text>
    <text x="702" y="204" class="sub">ESP32 + LoRa + Driver</text>
    <text x="702" y="220" class="sub">Solenoid Valve + Solar</text>

    <!-- Valve Node 2 (others) -->
    <rect class="block" x="880" y="160" width="160" height="90" rx="8"/>
    <text x="892" y="184" class="title">Valve Node #n</text>
    <text x="892" y="204" class="sub">(Other Field Sections)</text>

    <!-- Pump Controller Node -->
    <rect class="block" x="790" y="280" width="260" height="90" rx="8"/>
    <text x="802" y="306" class="title">Pump Controller Node</text>
    <text x="802" y="326" class="sub">ESP32 + LoRa + Relay / Contactor</text>
    <text x="802" y="344" class="sub">Pump + Power (Main / Solar)</text>

  </g>

  <!-- arrows master -> lora cloud and to pump -->
  <line x1="560" y1="110" x2="620" y2="110" class="arrow" />

  <!-- ACK arrows back -->
  <path d="M 820 200 Q 760 160 640 130" fill="none" class="arrow" stroke-dasharray="6 6" />
  <text x="700" y="150" class="sub">ACK / Status (valve ON/OFF)</text>

  <path d="M 900 330 Q 760 230 580 140" fill="none" class="arrow" stroke-dasharray="6 6" />
  <text x="720" y="220" class="sub">Pump ON ACK</text>

  <!-- Automation logic text near master -->
  <rect x="300" y="200" width="260" height="120" rx="8" fill="#ffffff" stroke="#94a3b8" />
  <text x="320" y="224" class="title">Master Logic</text>
  <text x="320" y="246" class="sub">• Parse SMS / App command</text>
  <text x="320" y="264" class="sub">• Map Field ID → Valve ID</text>
  <text x="320" y="282" class="sub">• Send LoRa command & await ACK</text>
  <text x="320" y="300" class="sub">• Control Pump based on valves' state</text>

  <!-- Power & Solar -->
  <rect class="block" x="30" y="200" width="220" height="130" rx="10"/>
  <text x="50" y="232" class="title">Power System</text>
  <text x="50" y="254" class="sub">Solar Panel + Charge Controller</text>
  <text x="50" y="274" class="sub">Battery (12V / 24V) → 5V / 3.3V</text>

  <!-- lines from power to nodes -->
  <line x1="160" y1="330" x2="690" y2="330" stroke="#0f1724" stroke-width="1" stroke-dasharray="3 4" />
  <text x="360" y="322" class="sub">Distributed Power (Solar/Battery)</text>

  <!-- Legend -->
  <rect x="30" y="360" width="1100" height="200" rx="8" fill="#ffffff" stroke="#e6eef8" />
  <text x="46" y="386" class="title">Legend & Notes</text>
  <text x="46" y="408" class="sub">• LoRa = Long-range radio between Master and Nodes</text>
  <text x="46" y="426" class="sub">• GSM = Cellular link for farmer commands (SMS / App fallback)</text>
  <text x="46" y="444" class="sub">• Valve Node = Solenoid valve driver, unique Node ID</text>
  <text x="46" y="462" class="sub">• Pump Controller = Controls pump via relay/contactor, ensures auto-off</text>

</svg>

<p class="note">Tip: You can open this file in a browser and save the diagram as an SVG/PNG. Tell me if you want a simplified PNG or a printable PDF version and I will update it.</p>

</body>
</html>
