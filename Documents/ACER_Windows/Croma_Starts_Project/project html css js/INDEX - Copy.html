<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calc.css">
    <title>CALCULATOR</title>

    
</head>
<body>
    <div class ="Container">
        <div class ="Calculator">
            <input type = "text" placeholder="0" id="outputS">
            <button onclick="clear()">Clr</button>
            <button onclick="del()">del</button>
            <button onclick="display('%')">%</button>
            <button onclick="display('/')">/</button>
            <button onclick="display('7')">7</button>
            <button onclick="display('8')">8</button>
            <button onclick="display('9')">9</button>
            <button onclick="display('*')">*</button>
            <button onclick="display('+')">+</button>
            <button onclick="display('0')">0</button>
            <button onclick="display('1')">1</button>
            <button onclick="display('2')">2</button>
            <button onclick="display('3')">3</button>
            <button onclick="display('-')">-</button>
            <button onclick="display('.')">.</button>
            <button onclick="display(',')">,</button>
            <button onclick="display('4')">4</button>
            <button onclick="display('5')">5</button>
            <button onclick="display('6')">6</button>
            <button onclick="display('=')" class="equal">=</button>
            

        </div>
        <script>
            let outputScreen = document.getElementById("outputS");  

            function display (num){     // for dispay element
                outputScreen.value +=num;
            
            }
            function Calculate(){
                try{
                    outputScreen.value = eval(outputScreen.value);
                }
                catch(err){
                    alert("INVALID STATEMENT");
                }
            }
    
            
            </script>
    </div>
</body>
</html>
