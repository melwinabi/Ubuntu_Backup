<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> COUNT-DOWN TIMER </title>
    <link rel="stylesheet" href="count.css">
</head>
<body>
    <script src="count.js"></script>
  <h1 class="tim">TIMER</h1>
  <div class="counter">
   
    <div class="box">
        <h2 id="days">00</h2>
        <small>DAYS</small>
    </div>

    <div class="box">
        <h2 id="hrs">00</h2>
        <small>HOURS</small>
    </div>

    <div class="box">
        <h2 id="min">00</h2>
        <small>MINUTES</small>
    </div>

    <div class="box">
        <h2 id="sec">00</h2>
        <small>SECONDS</small>
    </div>

  </div>


</body>
</html>
